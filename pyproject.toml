[project]
name = "agent-ops-platform"
version = "0.1.0"
description = "Deterministic commerce multi-agent orchestration foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-memory @ git+https://github.com/luckyrichor/agent-memory.git@bb09ed0693d23aa6e8538c0cee2cdfe807cf00ce",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "uvicorn>=0.30,<1",
]
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "testcontainers[postgres]>=4.8,<5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/agent_ops"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.mypy]
strict = true
python_version = "3.12"
[tool.ruff]
line-length = 100
target-version = "py312"
